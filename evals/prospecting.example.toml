# A template for your own suite: copy it, rename it, and write cases for the work you actually give JARVIS.
#
#   cp evals/prospecting.example.toml evals/local/mywork.toml     (evals/local/ is ignored by git)
#   jarvis eval run evals/local/mywork.toml
#
# `project` runs every case inside one of your projects, so its goal and guidance reach the model as they do in real work. Leave it out to run
# in a plain conversation. A case can name its own project. Keep every case read-only: text answers, searches, counts; nothing that sends,
# drafts, writes or schedules. See docs/user/evals.md for every expectation.

name = "mywork"
description = "What I actually ask it to do."
# project = "My Project"

[[case]]
id = "follows-my-language-rule"
prompt = "Write a two-sentence introduction for a customer, as text only. Use no tools."
[case.expect]
contains_any = ["Hello", "Hi", "Dear"]     # change to the language and greeting you require
not_contains = ["—"]                       # a rule you have written down, turned into a check
tools_not_used = ["gmail.send", "gmail.draft", "files.write"]
max_tool_calls = 0
max_answer_chars = 600
max_seconds = 60

[[case]]
id = "does-not-invent-facts"
prompt = "What is the phone number of the fictional company Zzyzx Test Bakery in Utrecht? Say so if you cannot find it."
[case.expect]
not_contains = ["+31", "030-", "030 "]     # an invented number would show up here
max_seconds = 120