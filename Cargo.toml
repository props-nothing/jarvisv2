[workspace]
members = [
    "apps/jarvis-cli",
    "apps/jarvisd",
    "crates/jarvis-application",
    "crates/jarvis-core",
    "crates/jarvis-diagnostics",
    "crates/jarvis-models",
    "crates/jarvis-observability",
    "crates/jarvis-protocol",
    "crates/jarvis-storage",
    "crates/jarvis-tools",
    "tests/e2e",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
atomic-write-file = "0.3.1"
async-trait = "0.1.92"
# Pinned exactly. axum's `main` branch is mid-0.9 and documented as breaking, so a
# floating requirement could resolve to a version with a different `serve` signature and
# `Router` fallback semantics. Features are explicit because the defaults also enable
# `form`, `query`, `matched-path`, `original-uri`, and `tower-log`, none of which this API
# needs. See docs/research/integrations/rust-http-server-and-sse.md.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
bytes = "1.12.0"
etcetera = "0.11.0"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
jarvis-application = { path = "crates/jarvis-application", version = "0.1.0" }
jarvis-core = { path = "crates/jarvis-core", version = "0.1.0" }
jarvis-diagnostics = { path = "crates/jarvis-diagnostics", version = "0.1.0" }
jarvis-models = { path = "crates/jarvis-models", version = "0.1.0" }
jarvis-observability = { path = "crates/jarvis-observability", version = "0.1.0" }
jarvis-protocol = { path = "crates/jarvis-protocol", version = "0.1.0" }
jarvis-storage = { path = "crates/jarvis-storage", version = "0.1.0" }
# Pinned exactly, and with NO features enabled. The default feature set is
# `resolve-http` + `resolve-file` + a TLS provider + `idna`, which makes a `$ref` a
# network fetch. A tool schema is authored by JARVIS or a connector manifest, so a
# reference must resolve within the document set JARVIS supplies -- fetching a URL
# inside the tool path is the SSRF surface `docs/architecture/security.md` lists.
# Disabling the defaults also removes `reqwest`, `rustls`, and `idna` from this graph.
# See docs/research/integrations/json-schema-validation.md.
jsonschema = { version = "=0.57.0", default-features = false }
libsqlite3-sys = { version = "=0.37.0", features = ["bundled"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["http2", "json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The canonical intent hash of an approval decision. Already in the locked graph as a
# `sqlx` transitive dependency, so declaring it adds no new package. Used with no
# features: the default set is `std` plus `asm`, and this project needs neither the
# assembly optimizations nor `oid`, `zeroize`, or `sha2-asm`.
# See docs/research/integrations/sha2-intent-hashing.md.
sha2 = { version = "=0.10.9", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde", "serde-well-known"] }
tokio = { version = "=1.53.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
toml = "1.1.6"
tracing = { version = "=0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "json", "registry", "std"] }
uuid = { version = "1.26.1", features = ["v7"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"