name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint all targets
        # `--locked` keeps the lint run on the committed lockfile, like every other
        # step. Without it a dependency could resolve differently here than in the
        # test step, so a lint verdict would not describe the tree that was tested.
        #
        # `--message-format=short` prints one line per diagnostic as
        # `file:line:column: level: message`, which the next step can turn into a
        # GitHub annotation. Output is redirected rather than piped so the exit code
        # is clippy's own: in a pipeline it would be the last command's, and a lint
        # failure would report success.
        #
        # This step failing on only some operating systems means a platform-gated
        # lint: `#[cfg(unix)]` or `#[cfg(windows)]` code is not compiled by the other
        # runners, so a warning it produces is invisible there. Two such failures were
        # diagnosed by inference, because `jarvis-storage` and `jarvis-models` cannot
        # be cross-linted on a machine without a C toolchain (bundled SQLite and
        # The job log itself requires repository authentication and is not readable
        # from an anonymous fetch, so the annotation step exists to make the next
        # occurrence readable rather than deduced.
        #
        # `shell: bash` is explicit. The default shell on windows-latest is PowerShell,
        # where redirecting a native command's stderr makes PowerShell treat it as an
        # error record and fail the step even on success -- the same reason this
        # repository's local runs read `$LASTEXITCODE` from a file instead of a pipe.
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features --locked --message-format=short -- -D warnings > clippy.txt 2>&1
      - name: Annotate lint failures
        if: failure()
        shell: bash
        run: |
          # `set +e` first, because a reporting step must never be the thing that fails.
          #
          # GitHub runs `bash` steps with `-e -o pipefail`. Under `-e`, a `grep` that
          # finds nothing exits 1 and aborts the script, so the previous version of this
          # step FAILED ITSELF with exit code 1 and emitted only its first line -- the
          # annotations showed "clippy.txt has 397 lines" and then nothing, which is why
          # the underlying compile error stayed unreadable. It was validated locally with
          # `set -u` only, which does not reproduce the runner's errexit. Validate shell
          # steps with `bash -eo pipefail`.
          set +e

          [ -f clippy.txt ] || { echo "::error::clippy.txt was not created by the lint step"; exit 0; }

          # Emit a SMALL, targeted region. GitHub caps annotations per check run and
          # silently drops the rest, so the previous version -- which emitted up to 45
          # lines from the first match to the end of the output -- had its annotations
          # filled with cargo's `Checking ...` progress lines while the actual diagnostic
          # was dropped. Fewer lines is the point: the goal is that the error survives
          # the cap.
          #
          # One line per diagnostic, PLUS the tail unconditionally.
          #
          # The per-diagnostic lines are what make a single run reveal several lints,
          # since GitHub caps annotations and drops the rest. But they assumed a
          # short-format diagnostic exists at all, and an annotation set containing only
          # "Process completed with exit code 101" proves the output had none -- a
          # build-script failure, a linker error, or output the short format does not
          # cover. So the tail is always emitted too, and the two together are the whole
          # story: what the lints were, and what the process actually exited on.
          grep -a -E '^[^ ]+:[0-9]+:[0-9]+: (error|warning)' clippy.txt | head -n 10 | while IFS= read -r line; do
            echo "::error::diag: $line"
          done
          tail -n 6 clippy.txt | while IFS= read -r line; do
            echo "::error::tail: $line"
          done
          echo "===== diagnostics ====="
          grep -a -E '^[^ ]+:[0-9]+:[0-9]+: (error|warning)' clippy.txt | head -n 60 || true
          echo "===== tail 40 ====="
          tail -n 40 clippy.txt || true

          echo "===== diagnostic (full) ====="
          cat clippy.txt
      - name: Test workspace
        # Output is captured to a file so a failure can be reported through annotations,
        # which are the only channel readable without repository authentication. The lint
        # step got this treatment after five rounds of inference; the test step needs it
        # for the same reason, because the failing crates cannot be compiled locally for
        # a non-native target and so their unix-only tests run ONLY on this runner.
        #
        # `shell: bash` because the default shell on windows-latest is PowerShell, where
        # redirecting a native command's stderr fails the step even on success.
        shell: bash
        run: cargo test --workspace --all-features --locked > test.txt 2>&1
      - name: Annotate test failures
        if: failure()
        shell: bash
        run: |
          set +e
          [ -f test.txt ] || { echo "::error::test.txt was not created by the test step"; exit 0; }

          # A failing test reports `test <name> ... FAILED`, a `---- <name> stdout ----`
          # block containing the panic, and a final `test result: FAILED` summary. Each
          # pattern is emitted separately and labelled, because GitHub caps annotations
          # and the label is what says which kind of line arrived.
          grep -a -E '^test .* FAILED|^failures:' test.txt | head -n 8 | while IFS= read -r line; do
            echo "::error::failed: $line"
          done
          grep -a -E 'panicked at|assertion|left:|right:' test.txt | head -n 10 | while IFS= read -r line; do
            echo "::error::panic: $line"
          done
          grep -a -E '^test result: FAILED' test.txt | head -n 4 | while IFS= read -r line; do
            echo "::error::summary: $line"
          done
          grep -a -E '^error(\[|:)' test.txt | head -n 6 | while IFS= read -r line; do
            echo "::error::error: $line"
          done

          echo "===== failures and panics ====="
          grep -a -B2 -A12 -E '^failures:|panicked at' test.txt | head -n 120 || true
          echo "===== tail 30 ====="
          tail -n 30 test.txt || true
      - name: Phase 1 acceptance gate
        # Runs the real jarvisd and jarvis binaries against a temporary portable
        # root on this native OS. The gate exits with a skip when the binaries are
        # absent, so ACCEPTANCE_REQUIRE_BINARIES turns that skip into a failure.
        # The name avoids the JARVIS_ prefix because the daemon rejects unknown
        # JARVIS_* variables as configuration errors.
        env:
          ACCEPTANCE_REQUIRE_BINARIES: "1"
        run: |
          cargo build --workspace --all-features --locked
          cargo test -p jarvis-acceptance --test phase1_gate --locked -- --nocapture
      - name: Phase 2 acceptance gate
        # Same shape as the Phase 1 gate, and the build is repeated deliberately: a
        # stale `jarvisd` beside the test binary would let the gate pass against code
        # that is not in this commit. That is not hypothetical — the gate's own
        # falsification run passed until the daemon was rebuilt.
        env:
          ACCEPTANCE_REQUIRE_BINARIES: "1"
        run: |
          cargo build --workspace --all-features --locked
          cargo test -p jarvis-acceptance --test phase2_gate --locked -- --nocapture

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit advisories, licenses, sources, and bans
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.98.1"
          command: check advisories bans licenses sources
          arguments: --all-features