name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint all targets
        # `--locked` keeps the lint run on the committed lockfile, like every other
        # step. Without it a dependency could resolve differently here than in the
        # test step, so a lint verdict would not describe the tree that was tested.
        #
        # `--message-format=short` prints one line per diagnostic as
        # `file:line:column: level: message`, which the next step can turn into a
        # GitHub annotation. Output is redirected rather than piped so the exit code
        # is clippy's own: in a pipeline it would be the last command's, and a lint
        # failure would report success.
        #
        # This step failing on only some operating systems means a platform-gated
        # lint: `#[cfg(unix)]` or `#[cfg(windows)]` code is not compiled by the other
        # runners, so a warning it produces is invisible there. Two such failures were
        # diagnosed by inference, because `jarvis-storage` and `jarvis-models` cannot
        # be cross-linted on a machine without a C toolchain (bundled SQLite and
        # The job log itself requires repository authentication and is not readable
        # from an anonymous fetch, so the annotation step exists to make the next
        # occurrence readable rather than deduced.
        #
        # `shell: bash` is explicit. The default shell on windows-latest is PowerShell,
        # where redirecting a native command's stderr makes PowerShell treat it as an
        # error record and fail the step even on success -- the same reason this
        # repository's local runs read `$LASTEXITCODE` from a file instead of a pipe.
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features --locked --message-format=short -- -D warnings > clippy.txt 2>&1
      - name: Annotate lint failures
        if: failure()
        shell: bash
        run: |
          # Reporting is deliberately unconditional and ordered by usefulness.
          #
          # Two rounds were spent inferring the cause of a unix-only lint failure because
          # this step reported the wrong thing: first nothing at all, then the FIRST
          # lines of the output, which are cargo's `Downloading crates ...` progress
          # noise. Errors come from a compiler or build script, so they appear at the
          # END. A reporting step that reports the wrong lines is as bad as one that
          # reports none, because both look like they worked.
          #
          # GitHub caps annotations per check run, so the most diagnostic output is
          # emitted first: error lines, then the tail, then file-annotated diagnostics.
          if [ ! -f clippy.txt ]; then
            echo "::error::clippy.txt was not created by the lint step"
            exit 0
          fi
          echo "::error::clippy.txt has $(wc -l < clippy.txt) lines"

          # 1. Every line mentioning an error, with its line number in the output.
          #    `-a` treats the file as text so a binary byte cannot stop the scan.
          grep -n -a -iE '(^|[^a-z])error' clippy.txt | head -n 20 | while IFS= read -r line; do
            echo "::error::${line}"
          done

          # 2. The tail, where a span-less compile or link failure appears.
          echo "::error::--- last 20 lines ---"
          tail -n 20 clippy.txt | while IFS= read -r line; do
            echo "::error::${line}"
          done

          # 3. Diagnostics that carry a span become file-annotated errors.
          grep -E '^[^ ]+:[0-9]+:[0-9]+: (error|warning)' clippy.txt 2>/dev/null \
            | sed -E 's/^([^ :]+):([0-9]+):([0-9]+): /::error file=\1,line=\2,col=\3::/' \
            | head -n 15 || true

          echo "===== error lines ====="
          grep -n -a -iE '(^|[^a-z])error' clippy.txt 2>/dev/null | head -n 80 || true
          echo "===== tail ====="
          tail -n 60 clippy.txt 2>/dev/null || true
      - name: Test workspace
        run: cargo test --workspace --all-features --locked
      - name: Phase 1 acceptance gate
        # Runs the real jarvisd and jarvis binaries against a temporary portable
        # root on this native OS. The gate exits with a skip when the binaries are
        # absent, so ACCEPTANCE_REQUIRE_BINARIES turns that skip into a failure.
        # The name avoids the JARVIS_ prefix because the daemon rejects unknown
        # JARVIS_* variables as configuration errors.
        env:
          ACCEPTANCE_REQUIRE_BINARIES: "1"
        run: |
          cargo build --workspace --all-features --locked
          cargo test -p jarvis-acceptance --test phase1_gate --locked -- --nocapture

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit advisories, licenses, sources, and bans
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.98.1"
          command: check advisories bans licenses sources
          arguments: --all-features