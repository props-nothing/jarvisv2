name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-features --locked
      - name: Phase 1 acceptance gate
        # Runs the real jarvisd and jarvis binaries against a temporary portable
        # root on this native OS. The gate exits with a skip when the binaries are
        # absent, so ACCEPTANCE_REQUIRE_BINARIES turns that skip into a failure.
        # The name avoids the JARVIS_ prefix because the daemon rejects unknown
        # JARVIS_* variables as configuration errors.
        env:
          ACCEPTANCE_REQUIRE_BINARIES: "1"
        run: |
          cargo build --workspace --all-features --locked
          cargo test -p jarvis-acceptance --test phase1_gate --locked -- --nocapture

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit advisories, licenses, sources, and bans
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.98.1"
          command: check advisories bans licenses sources
          arguments: --all-features