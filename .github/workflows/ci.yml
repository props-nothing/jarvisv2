name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint all targets
        # `--locked` keeps the lint run on the committed lockfile, like every other
        # step. Without it a dependency could resolve differently here than in the
        # test step, so a lint verdict would not describe the tree that was tested.
        #
        # `--message-format=short` prints one line per diagnostic as
        # `file:line:column: level: message`, which the next step can turn into a
        # GitHub annotation. Output is redirected rather than piped so the exit code
        # is clippy's own: in a pipeline it would be the last command's, and a lint
        # failure would report success.
        #
        # This step failing on only some operating systems means a platform-gated
        # lint: `#[cfg(unix)]` or `#[cfg(windows)]` code is not compiled by the other
        # runners, so a warning it produces is invisible there. Two such failures were
        # diagnosed by inference, because `jarvis-storage` and `jarvis-models` cannot
        # be cross-linted on a machine without a C toolchain (bundled SQLite and
        # The job log itself requires repository authentication and is not readable
        # from an anonymous fetch, so the annotation step exists to make the next
        # occurrence readable rather than deduced.
        #
        # `shell: bash` is explicit. The default shell on windows-latest is PowerShell,
        # where redirecting a native command's stderr makes PowerShell treat it as an
        # error record and fail the step even on success -- the same reason this
        # repository's local runs read `$LASTEXITCODE` from a file instead of a pipe.
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features --locked --message-format=short -- -D warnings > clippy.txt 2>&1
      - name: Annotate lint failures
        if: failure()
        shell: bash
        run: |
          # `set +e` first, because a reporting step must never be the thing that fails.
          #
          # GitHub runs `bash` steps with `-e -o pipefail`. Under `-e`, a `grep` that
          # finds nothing exits 1 and aborts the script, so the previous version of this
          # step FAILED ITSELF with exit code 1 and emitted only its first line -- the
          # annotations showed "clippy.txt has 397 lines" and then nothing, which is why
          # the underlying compile error stayed unreadable. It was validated locally with
          # `set -u` only, which does not reproduce the runner's errexit. Validate shell
          # steps with `bash -eo pipefail`.
          set +e

          [ -f clippy.txt ] || { echo "::error::clippy.txt was not created by the lint step"; exit 0; }
          echo "::error::clippy.txt has $(wc -l < clippy.txt) lines; error region follows"

          # Print from the first diagnostic to the end, so the error code, its
          # ` --> file:line:col` span, the source line, and any `= help:` notes are all
          # visible. Annotations are the only diagnostic channel readable without
          # authenticating, and this environment cannot compile the failing crates
          # locally: `jarvis-storage`, `jarvis-diagnostics` and `jarvis-models` need a C
          # toolchain for a non-native target and no C compiler is installed here.
          first="$(grep -n -a -m1 -iE 'error(\[|:)' clippy.txt | cut -d: -f1)"
          if [ -n "$first" ]; then
            tail -n "+$first" clippy.txt | head -n 45 | while IFS= read -r line; do
              echo "::error::$line"
            done
          else
            tail -n 45 clippy.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

          echo "===== error region ====="
          if [ -n "$first" ]; then
            tail -n "+$first" clippy.txt | head -n 120
          fi
      - name: Test workspace
        run: cargo test --workspace --all-features --locked
      - name: Phase 1 acceptance gate
        # Runs the real jarvisd and jarvis binaries against a temporary portable
        # root on this native OS. The gate exits with a skip when the binaries are
        # absent, so ACCEPTANCE_REQUIRE_BINARIES turns that skip into a failure.
        # The name avoids the JARVIS_ prefix because the daemon rejects unknown
        # JARVIS_* variables as configuration errors.
        env:
          ACCEPTANCE_REQUIRE_BINARIES: "1"
        run: |
          cargo build --workspace --all-features --locked
          cargo test -p jarvis-acceptance --test phase1_gate --locked -- --nocapture

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit advisories, licenses, sources, and bans
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.98.1"
          command: check advisories bans licenses sources
          arguments: --all-features