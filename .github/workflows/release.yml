name: Release (private artifacts)

# Builds the two programs for each platform and packages them.
#
#   * It runs by itself on every push to `main` (code changes only) and can be run by hand (Actions > "Release (private
#     artifacts)" > Run workflow). Either gives **workflow artifacts**, kept 14 days: open the run and download the archive for
#     your platform. This repository is public, so anyone signed in to GitHub can download the artifacts of a public repository.
#   * Push a tag (`git tag v0.1.0 && git push origin v0.1.0`) to also attach the archives to a **draft** GitHub release. A draft is
#     visible only to people with write access, so it is the durable place to download the exe from; publish it by hand when
#     you decide to.
#
# No *published* release is ever created here, because no licence has been chosen for JARVIS yet (README.md, "License Status"),
# which blocks distributing it. When a licence is chosen, publishing is one extra step.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Documentation alone does not change what is shipped, so it does not spend five builds.
    paths-ignore:
      - "**.md"
      - "docs/**"
    tags:
      - "v*"

# A newer push to the same ref makes an older build pointless; a tag build is never cancelled by a branch push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  draft:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --prerelease \
                 --title "JARVIS $GITHUB_REF_NAME" \
                 --notes "Unsigned private build. Unpack and run jarvis (one program). See docs/user/quick-start.md."

  package:
    needs: draft
    # `draft` is skipped for a manual run, and a skipped dependency would skip this job too unless it is named here.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    permissions:
      contents: write
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-x86_64, target: "" }
          - { os: ubuntu-24.04-arm, label: linux-aarch64, target: "" }
          - { os: macos-latest, label: macos-aarch64, target: "" }
          # Built on the Apple-silicon runner for the Intel target, so it is not smoke-tested here.
          - { os: macos-latest, label: macos-x86_64, target: x86_64-apple-darwin }
          - { os: windows-latest, label: windows-x86_64, target: "" }
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report pinned toolchain
        run: |
          rustup show active-toolchain
          cargo --version
      - name: Add the cross target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: Build release programs
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --locked --target "${{ matrix.target }}" -p jarvis-cli
          else
            cargo build --release --locked -p jarvis-cli
          fi
      - name: Package
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            bash scripts/package-release.sh "${{ matrix.label }}" "target/${{ matrix.target }}/release"
          else
            bash scripts/package-release.sh "${{ matrix.label }}"
          fi
      - name: Smoke test the packaged programs
        # The archive is unpacked into an empty folder and the programs are asked for their version, which proves they start and
        # that nothing outside the archive is needed. Skipped for the cross-built Intel macOS archive, which cannot run here.
        if: matrix.target == ''
        shell: bash
        run: |
          rm -rf smoke && mkdir smoke
          # `find`, not `ls dist/*.zip`: a glob that matches nothing makes `ls` exit 2, which `pipefail` turns into a failed step.
          archive="$(find dist -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | head -n 1)"
          case "$archive" in
            *.zip) (cd smoke && unzip -q "../$archive" || 7z x -bso0 "../$archive") ;;
            *) tar -C smoke -xzf "$archive" ;;
          esac
          dir="$(ls -d smoke/jarvis-*)"
          ext=""; [ -f "$dir/jarvis.exe" ] && ext=".exe"
          "$dir/jarvis$ext" version
          "$dir/jarvis$ext" daemon --version
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jarvis-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14