[package]
name = "jarvis-acceptance"
description = "Process-level acceptance gate: proves the installed platform, not libraries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# A test-only package: the library target is empty so the gate lives entirely in
# integration tests and never becomes a dependency of shipped code.
[lib]
path = "src/lib.rs"

[dependencies]
# The acceptance gates build a temporary root with a name that cannot repeat across runs, which is
# `jarvis_core::scratch_tag`. A **normal** dependency rather than a dev-only one because the gates live in
# `tests/`, which cargo compiles against the crate's own dependency list; `jarvis-storage` already brings
# `jarvis-core` into the graph, so declaring it adds no package.
jarvis-core.workspace = true
jarvis-storage.workspace = true

[dev-dependencies]
# The Phase 2 gate drives the run API as a client would, so it needs the same
# HTTP client the CLI uses rather than a second hand-written one.
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
