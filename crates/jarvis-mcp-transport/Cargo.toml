[package]
name = "jarvis-mcp-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Enables the `fixture-peer` binary, a hand-written MCP server used as a **real child process** by
# the stdio tests. Off by default, so `cargo build --workspace` never builds it and it cannot be
# mistaken for a shipped binary. `cargo test -p jarvis-mcp-transport --features fixture-peer`
# turns it on.
fixture-peer = []

# A hand-written MCP server speaking the stdio wire format, spawned as a real child process by the
# `stdio` integration test. Declared here so the integration test can find it beside itself rather
# than needing a separate package: `cargo test --features fixture-peer` builds this binary into the
# same target directory the test executable lives in.
[[bin]]
name = "fixture-peer"
path = "src/bin/fixture_peer.rs"
required-features = ["fixture-peer"]

[lints]
workspace = true

[dependencies]
# The `ToolExecutor` port this crate implements, and the outcome/evidence/output types an adapter must
# build. Declared as a normal dependency rather than a dev-only one because the MCP adapter IS a
# `ToolExecutor`: `P3-008h` is where a remote server becomes a callable tool, and the port is the
# canonical contract it implements. Already in the graph through `jarvis-mcp`.
jarvis-tools.workspace = true
# `async_trait` because the `ToolExecutor` port is an async trait, and implementing it requires the
# same macro the trait is declared with. Already in the graph via `jarvis-tools`.
async-trait.workspace = true
jarvis-core.workspace = true
jarvis-mcp.workspace = true
# Declared directly rather than reached through `rmcp`, because this crate **builds the HTTP client**
# for a remote MCP connection instead of accepting the SDK's convenience constructor. The SDK's own
# `default_http_client` disables redirects but does not call `no_proxy`, so proxy behaviour there is a
# side effect of a feature flag in the SDK's manifest rather than a stated property; `P3-008g` states
# it here so a feature unification elsewhere in the graph cannot silently re-enable an unchosen
# intermediary. Declaring it adds no package — `reqwest` is already in the graph through `rmcp`.
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The host configuration surface (`P3-008i`) is a TOML document, so the MCP host role knows the same
# document format as the daemon's own configuration. Parsing it here rather than in `jarvis-storage`
# keeps one schema owner per document: the daemon's schema stays in storage, and the MCP section's
# schema lives beside the code that consumes it. Already in the graph via `jarvis-storage`.
toml.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# `io-util` for `duplex` and the split/buffered reads the scripted peer uses, `time` for the
# negotiation deadlines, and `rt-multi-thread` so a timeout can fire while another task is blocked on
# a read — on a single-threaded runtime the timeout and the read are the same thread and a hung
# negotiation would hang the test instead of failing it.
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
# The served-handler tests drive the SDK's **real** Streamable HTTP service rather than only the handler's
# own method, so they build an `http::Request` and read an `http::Response` body. `tower` supplies
# `ServiceExt::oneshot`, which is how the SDK's own tests drive its service. All three are already in the
# lock (`http` and `http-body-util` through `axum`, `tower` through the daemon), so declaring them adds no
# package — the same reasoning `reqwest` is declared rather than reached through `rmcp`.
http = { version = "1.5", default-features = false }
http-body-util = "0.1.5"
tower.workspace = true
# The host-join tests assert against canonical risk and approval values, which live in
# `jarvis-tools`. It is already a transitive dependency through `jarvis-mcp`; declaring it here
# rather than re-exporting the two enums from this crate keeps the transport's public surface
# free of the domain vocabulary it does not own.
jarvis-tools.workspace = true
