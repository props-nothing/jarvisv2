[package]
name = "jarvis-mcp-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
jarvis-core.workspace = true
jarvis-mcp.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# `io-util` for `duplex` and the split/buffered reads the scripted peer uses, `time` for the
# negotiation deadlines, and `rt-multi-thread` so a timeout can fire while another task is blocked on
# a read — on a single-threaded runtime the timeout and the read are the same thread and a hung
# negotiation would hang the test instead of failing it.
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
