[package]
name = "jarvis-cli"
description = "Thin command-line client for the JARVIS daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "jarvis"
path = "src/main.rs"

[dependencies]
# One executable (ADR-0144): jarvis daemon runs the daemon, so a person installs a single file.
jarvisd = { path = "../jarvisd" }
jarvis-core.workspace = true
jarvis-connectors.workspace = true
jarvis-diagnostics.workspace = true
jarvis-observability.workspace = true
jarvis-protocol.workspace = true
jarvis-web.workspace = true
jarvis-storage.workspace = true
# The daemon's run API is HTTP (ADR-0011). `reqwest` is already resolved in this
# workspace through the model adapter, so this adds no new version. Its defaults are
# overridden in `api_client.rs`: proxies and redirects off, verification on.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true