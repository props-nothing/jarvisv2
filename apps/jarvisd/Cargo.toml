[package]
name = "jarvisd"
description = "Trusted JARVIS control-plane daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Routing lives here, not in a domain crate: ADR-0011 places the HTTP gateway in the
# composition root and forbids Axum in `jarvis-core`, `jarvis-application`, and
# `jarvis-storage`. DTOs stay in `jarvis-protocol`.
axum = { workspace = true }
jarvis-application.workspace = true
jarvis-core.workspace = true
# The run executor is an adapter consumer, so it belongs in this composition root:
# `repository-layout.md` allows `jarvis-application` to depend only on `jarvis-core` and has no
# arrow from application into an adapter, so the provider port is reached here where the
# routing already lives.
jarvis-models.workspace = true
# The MCP host is composed here for the same reason the tool pipeline is: `repository-layout.md` has no
# arrow from `jarvis-application` into an adapter crate, so a binary is the only place a third-party
# server's tools can be joined to the canonical registry. This is the dependency that makes an MCP
# server reachable by an **operator** rather than only by a test — the limit `P3-008a`..`P3-008i` each
# recorded.
jarvis-mcp-transport.workspace = true
jarvis-observability.workspace = true
jarvis-protocol.workspace = true
jarvis-storage.workspace = true
# The tool pipeline is composed here, for the same reason the run executor is: `repository-layout.md`
# allows no arrow from `jarvis-application` into an adapter crate, so the registry, the policy engine,
# the call lifecycle, and the filesystem adapter are joined in the composition root. That is also what
# keeps `AGENTS.md`'s rule structural — an adapter is only reachable from a binary that chose to
# construct one, never from the application layer.
jarvis-tools.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `unfold` builds the SSE stream without a generator macro, so the stream type stays a plain
# `Stream` impl and no `async-stream` dependency is introduced for one call site.
futures-util.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing.workspace = true

[dev-dependencies]
# `ServiceExt::oneshot` drives a `Router` without binding a socket, so the gateway's
# authentication and routing are tested as a real `tower` service rather than by calling the
# handlers directly, which would bypass the layers the tests exist to falsify.
tower.workspace = true
# `ToolExecutor` is an async trait, so the test double in `dispatch` needs the same macro the trait is
# declared with. A dev-dependency rather than a normal one: the daemon itself implements no executor.
async-trait.workspace = true
# The routing test builds an MCP definition the way the catalog does, which needs the translation types. A
# dev-dependency because the daemon **never names an MCP type in production** — it composes the transport's
# adapters and holds them as `dyn ToolExecutor`, so a normal dependency here would be one with no production
# consumer.
jarvis-mcp.workspace = true

[lints]
workspace = true